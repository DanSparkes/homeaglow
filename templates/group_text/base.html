<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GroupText{% endblock title %}</title>
  <meta name="description" content="GroupText is a Django demo app for sending group messages with HTMX and Alpine.js.">
  <meta name="keywords" content="Django, HTMX, Alpine.js, group messaging, demo">
  <meta name="csrf-token" content="{{ csrf_token }}">

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }

    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { opacity: 1; }
  </style>

  {% block head %}{% endblock head %}
</head>

<body class="bg-gray-50 text-gray-900 antialiased">

  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">

        <a href="{% url 'home' %}" class="flex items-center gap-2 font-bold text-indigo-600 text-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
          GroupText
        </a>

        <div class="hidden sm:flex items-center gap-6 text-sm font-medium text-gray-600">
          <a href="{% url 'home' %}" class="hover:text-indigo-600 transition-colors">Home</a>
          {% if user.is_superuser %}
          <a href="{% url 'admin:index' %}" class="hover:text-indigo-600 transition-colors">Admin</a>
          {% endif %}
        </div>
      </div>
    </div>

  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    {% block content %}{% endblock content %}
  </main>

  <script>
    (function () {
      function getCsrfToken() {
        const meta = document.querySelector('meta[name="csrf-token"]');
        if (meta) return meta.content;
        const match = document.cookie.match(/csrftoken=([^;]+)/);
        return match ? match[1] : '';
      }

      document.addEventListener('htmx:configRequest', function (evt) {
        const token = getCsrfToken();
        if (token) {
          evt.detail.headers['X-CSRFToken'] = token;
        }
      });

      htmx.config.defaultSwapStyle = 'innerHTML';
    })();
  </script>

  {% block scripts %}{% endblock scripts %}
</body>
</html>
