<div id="chat-{{ group.id }}" class="pt-4 mt-4 border-t border-gray-100">
  {% if is_member %}
  <form hx-post="{% url 'group-send-message' group.id %}"
        hx-target="#chat-{{ group.id }}"
        hx-swap="outerHTML"
        class="space-y-2">
    {% csrf_token %}
    <label for="message-{{ group.id }}" class="block text-xs font-medium text-gray-600">
      Chat message
    </label>
    <textarea id="message-{{ group.id }}"
              name="body"
              rows="2"
              placeholder="Write a message..."
              required
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"></textarea>
    <div class="flex items-center justify-between gap-3">
      {% if error %}
      <p class="text-xs text-red-500">{{ error }}</p>
      {% elif sent_count is not None %}
      <p class="text-xs text-green-600">
        Message sent to {{ sent_count }} member{{ sent_count|pluralize }}.
      </p>
      {% else %}
      <p class="text-xs text-gray-400">SMS fan-out sends this to other group members.</p>
      {% endif %}
      <button type="submit"
              class="text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded-lg transition-colors">
        Send
      </button>
    </div>
  </form>
  {% else %}
  <p class="text-xs text-gray-400 pt-1">Join this group to send messages.</p>
  {% endif %}
</div>
